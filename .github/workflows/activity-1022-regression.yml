name: 1022 活动完整流程

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect 只查询；signin 真实停留并确认签到后结束（不抽奖、不提现）
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - signin
      max_wait_minutes:
        description: 等待上限（0～200 分钟；三小时签到建议填 200）
        required: true
        default: '200'
        type: string
  schedule:
    # 前一天 UTC 23:20 = 北京时间每天 07:20。
    - cron: '20 23 * * *'

permissions:
  contents: read

concurrency:
  group: linping-1022-signin-accounts
  cancel-in-progress: false

env:
  LINPING_ACTIVITY: '1022'
  LINPING_ACCOUNTS: ${{ secrets.LINPING_1022_ACCOUNTS || (!secrets.LINPING_1022_TOKEN && secrets.LINPING_ACCOUNTS) || '' }}
  LINPING_TOKEN: ${{ secrets.LINPING_1022_TOKEN || secrets.LINPING_TOKEN }}
  LINPING_DEVICE_ID: ${{ secrets.LINPING_1022_DEVICE_ID || secrets.LINPING_DEVICE_ID }}
  LINPING_USER_ID: ${{ vars.LINPING_1022_USER_ID || vars.LINPING_USER_ID || '19426008' }}
  MODE: ${{ inputs.mode }}
  MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes }}
  RANDOM_WINDOW_MINUTES: ${{ vars.LINPING_1022_RANDOM_WINDOW_MINUTES || vars.RANDOM_WINDOW_MINUTES || '60' }}

jobs:
  prepare:
    if: ${{ github.event_name != 'schedule' || vars.LINPING_1022_DAILY != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slots: ${{ steps.plan.outputs.slots }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: 离线自测（不接触 Token）
        env:
          LINPING_ACCOUNTS: ''
          LINPING_TOKEN: ''
          LINPING_DEVICE_ID: ''
        run: node --test tests/*.test.mjs tests/activity-1022/*.test.mjs
      - name: 校验账号并生成独立启动计划
        id: plan
        run: node scripts/daily.mjs --plan

  signin:
    name: 1022 账号 ${{ matrix.slot }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: ${{ fromJSON(format('[{0}]', needs.prepare.outputs.slots)) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: 1022 真实停留签到（确认当日签到后结束，不抽奖、不提现）
        env:
          ACCOUNT_SLOT: ${{ matrix.slot }}
        run: node scripts/daily.mjs --account "$ACCOUNT_SLOT"
