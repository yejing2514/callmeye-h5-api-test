name: 1022 签到离线回归
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && '1022 手动回归'
      || github.event_name == 'workflow_run' && '1022：621 结束后回归'
      || '1022：独立排程检查' }}

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['H5 接口测试']
    types: [completed]
  schedule:
    # 仅在 621 被手动停用时独立运行：05:20 UTC = 北京时间 13:20。
    - cron: '20 5 * * *'

permissions: {}

jobs:
  check_621:
    name: 检查 621 是否已停用
    if: ${{ github.event_name == 'schedule' && vars.LINPING_1022_DAILY != 'false' }}
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: 读取 621 工作流状态
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/callmeye.yml" --jq '.state')
          if [[ "$state" == 'disabled_manually' ]]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          else
            echo '621 未被手动停用；1022 等待 621 的定时运行结束。'
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          fi

  contract:
    name: 1022 离线回归
    needs: check_621
    if: >-
      ${{ !cancelled() && (
          github.event_name == 'workflow_dispatch' || (
            vars.LINPING_1022_DAILY != 'false' && (
              (github.event_name == 'workflow_run'
                && github.event.workflow_run.path == '.github/workflows/callmeye.yml'
                && github.event.workflow_run.event == 'schedule'
                && github.event.workflow_run.head_branch == github.event.repository.default_branch
                && github.event.workflow_run.run_attempt == 1)
              || (github.event_name == 'schedule' && needs.check_621.outputs.should_run == 'true')
            )
          )
      ) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: 检查 1022 计时会话和金币奖励（离线）
        run: node --test tests/activity-1022/contract.test.mjs
