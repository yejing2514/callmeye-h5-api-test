name: H5 接口测试

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect 只检查；signin 真实等待后尝试签到
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - signin
      max_wait_minutes:
        description: 等待上限（0～200 分钟；完整三小时测试建议填 200）
        required: true
        default: '200'
        type: string
  # UTC 23:20，即次日北京时间 07:20；每个账号另外随机延迟 0～10 分钟。
  # 随机窗口可用仓库变量 RANDOM_WINDOW_MINUTES 修改（0～90）。GitHub 可能延迟。
  schedule:
    - cron: '20 23 * * *'

permissions:
  contents: read

concurrency:
  group: linping-signin-accounts
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # A brace-free list of "<index>:<start_at_ms>" strings. GitHub registers
      # every line of a multi-line secret as a masked value and silently drops
      # job outputs containing those fragments, including curly braces.
      slots: ${{ steps.plan.outputs.slots }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: 离线自测（不接触 Token）
        run: node --test tests/*.test.mjs
      - name: 校验账号配置并生成启动计划（不请求业务接口）
        id: plan
        env:
          LINPING_ACCOUNTS: ${{ secrets.LINPING_ACCOUNTS }}
          LINPING_TOKEN: ${{ secrets.LINPING_TOKEN }}
          LINPING_DEVICE_ID: ${{ secrets.LINPING_DEVICE_ID }}
          LINPING_USER_ID: ${{ vars.LINPING_USER_ID || '19426008' }}
          MODE: ${{ inputs.mode }}
          MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes }}
          RANDOM_WINDOW_MINUTES: ${{ vars.RANDOM_WINDOW_MINUTES || '10' }}
        run: node scripts/daily.mjs --plan

  signin:
    name: 账号 ${{ matrix.slot }}
    needs: prepare
    runs-on: ubuntu-latest
    # 最多随机等 90 分钟 + 实际停留 200 分钟 + 请求/安装缓冲。
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # slots is an unbracketed fragment ("0:0","1:1"); wrap it here so braces
        # and brackets never appear inside a step output GitHub could redact.
        slot: ${{ fromJSON(format('[{0}]', needs.prepare.outputs.slots)) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: 按计划执行（每日自动签到 / 手动选定模式）
        env:
          LINPING_ACCOUNTS: ${{ secrets.LINPING_ACCOUNTS }}
          LINPING_TOKEN: ${{ secrets.LINPING_TOKEN }}
          LINPING_DEVICE_ID: ${{ secrets.LINPING_DEVICE_ID }}
          LINPING_USER_ID: ${{ vars.LINPING_USER_ID || '19426008' }}
          MODE: ${{ inputs.mode }}
          MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes }}
          RANDOM_WINDOW_MINUTES: ${{ vars.RANDOM_WINDOW_MINUTES || '10' }}
          # "<索引>:<计划时间戳>"，计划时间与 Index 一并来自矩阵维度本身。
          ACCOUNT_SLOT: ${{ matrix.slot }}
        run: node scripts/daily.mjs --account "$ACCOUNT_SLOT"
