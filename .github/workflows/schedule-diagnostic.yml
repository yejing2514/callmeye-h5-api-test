name: 临时定时诊断（不签到）

# Temporary probe for 2026-10-30 only. Remove after collecting schedule evidence.
# UTC 01:50 / 02:05 / 02:20 = Beijing 09:50 / 10:05 / 10:20.
# Cron has no year field; the step below prevents future-year probes.
on:
  push:
    branches: [main]
    paths: [.github/workflows/schedule-diagnostic.yml]
  schedule:
    - cron: '50 1 30 10 *'
    - cron: '5,20 2 30 10 *'

permissions: {}

concurrency:
  group: schedule-diagnostic-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout, external action, credentials, or business API requests.
      - name: 记录触发方式和实际启动时间
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [[ "$TRIGGER_EVENT" == 'schedule' && "$(date -u +%F)" != '2026-10-30' ]]; then
            echo 'Expired diagnostic: no probe was performed.'
            echo 'Expired diagnostic. Remove this temporary workflow.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          utc_now="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          beijing_now="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          {
            printf 'Event: %s\n' "$TRIGGER_EVENT"
            printf 'Cron: %s\n' "${TRIGGER_CRON:-not applicable (push smoke test)}"
            printf 'Started (UTC): %s\n' "$utc_now"
            printf 'Started (Beijing): %s\n' "$beijing_now"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf '\nNo credentials were read; no signin request was sent.\n'
            if [[ "$TRIGGER_EVENT" == 'push' ]]; then
              printf 'Push only verifies deployment, NOT scheduled delivery.\n'
            else
              printf 'A schedule event reached this workflow.\n'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
